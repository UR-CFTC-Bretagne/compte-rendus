name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests unitaires
        run: npm test
      - name: Compilation Apps Script
        run: npm run build
      - name: Vérifier les fichiers compilés
        run: |
          test -f dist/Code.gs
          test -f dist/Rules.gs
          test -f dist/Index.html
          test -f dist/appsscript.json
